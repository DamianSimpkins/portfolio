      - region "Interactive components" [ref=f4e82]:
        - generic [ref=f4e84]:
          - heading "Interactive components" [level=2] [ref=f4e85]
          - paragraph [ref=f4e86]: With the help of Claude Code I was able to build interactive components quickly, and they went live on the site as they are. Each one is production ready and driven by simple data points, so storage levels, trends and charts update dynamically and connect easily to live sources. Hover and scroll to try them below.
