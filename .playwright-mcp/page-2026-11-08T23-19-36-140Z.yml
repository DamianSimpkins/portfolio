          - heading "Design system" [level=2] [ref=f4e99]
          - paragraph [ref=f4e100]: With the new brand arriving at the same time, a full design system was built in Figma to carry it, from colours and type to buttons, form fields and components, then converted to code as a front-end component library. Storybook documents each component and its states, giving designers and developers one shared reference and keeping the site consistent as it grows.
