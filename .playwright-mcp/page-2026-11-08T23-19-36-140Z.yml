          - generic [ref=f4e17]:
            - paragraph [ref=f4e19]: GWMWater supplies water to communities across the Grampians, Wimmera and Mallee, and its website is where customers pay bills, report faults and check outages. The redesign coincided with GWMWater’s own brand redesign, so I redesigned the experience from the ground up around the new identity, from research and structure through to a responsive interface and a design system that keeps the site consistent and easier to maintain.
