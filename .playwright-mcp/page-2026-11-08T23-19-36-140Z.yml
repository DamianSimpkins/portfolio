      - region "Maps, outages and reporting a fault" [ref=f4e61]:
        - generic [ref=f4e63]:
          - heading "Maps, outages and reporting a fault" [level=2] [ref=f4e64]
          - paragraph [ref=f4e65]: When something goes wrong, customers want answers quickly, and often from a phone. An interactive outages map centres on their location in one tap and shows what is happening nearby. If nothing is logged, Report a fault is always in reach. On mobile the controls sit within thumb reach, with a list view for anyone who would rather scan than pan.
